<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>The Larkspur Nightcap - a mixed reality murder mystery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <script>
  /* =====================================================================
     THE LARKSPUR NIGHTCAP
     A mixed reality murder mystery for Quest 3. The crime scene sits on
     your real table, the evidence is hidden on your real walls, doors,
     windows, furniture and floor, and the story spills into your room.
     Built with the ideas from the A-Frame lectures:
       - entities + components          (Lecture 2)
       - tick() animation                (Lecture 2/3: mover, pulse, bob)
       - createElement + appendChild     (Lecture 3: every scene is built in JS)
       - click / mouseenter / raycaster  (Lecture 3/4: cards, suspects, buttons)
     ===================================================================== */

  // ---------- Look & feel ----------
  const PAL = {
    felt:  '#1f3a2e',   // green baize evidence table
    brass: '#c9a227',
    paper: '#e9dfc7',   // evidence-card paper
    seen:  '#bcd9b0',   // card paper after you have viewed it
    ink:   '#16202b',   // narration panel
    oxblood: '#6e1f22',
    text:  '#f3ecd8'
  };

  const COLORS = { edmund:'#7d3c98', vera:'#d64541', ilsa:'#3b82c4', basil:'#e0b028', thorne:'#3fa45b', grey:'#9aa5ad' };
  const NAMES  = { edmund:'Edmund', vera:'Vera', ilsa:'Dr. Moreau', basil:'Basil', thorne:'Col. Thorne', grey:'Insp. Grey' };

  // ---------- Small helpers (same pattern as the lectures) ----------
  const P = (x, y, z) => `${x} ${y} ${z}`;

  function make(tag, attrs, parent) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (k === 'class') el.className = attrs[k];
        else el.setAttribute(k, attrs[k]);
      }
    }
    if (parent) parent.appendChild(el);
    return el;
  }

  function withAlpha(extra) {
    extra = Object.assign({}, extra || {});
    if (extra.opacity !== undefined && extra.opacity < 1) extra.transparent = true;
    return extra;
  }

  function setText(el, value, opts) {
    el.setAttribute('text', Object.assign({ value: value, color: PAL.text, align: 'center', width: 0.5, wrapCount: 30 }, opts || {}));
    return el;
  }

  // A "builder" creates primitives inside one parent entity.
  function builder(root) {
    return {
      root,
      at: (el) => builder(el),
      box:  (x, y, z, w, h, d, color, extra) => make('a-box', Object.assign({ position: P(x, y, z), width: w, height: h, depth: d, color }, withAlpha(extra)), root),
      cyl:  (x, y, z, r, h, color, extra) => make('a-cylinder', Object.assign({ position: P(x, y, z), radius: r, height: h, color, 'segments-radial': 14 }, withAlpha(extra)), root),
      ball: (x, y, z, r, color, extra) => make('a-sphere', Object.assign({ position: P(x, y, z), radius: r, color, 'segments-width': 12, 'segments-height': 8 }, withAlpha(extra)), root),
      cone: (x, y, z, rb, rt, h, color, extra) => make('a-cone', Object.assign({ position: P(x, y, z), 'radius-bottom': rb, 'radius-top': rt, height: h, color, 'segments-radial': 10 }, withAlpha(extra)), root),
      group: (x, y, z, extra) => make('a-entity', Object.assign({ position: P(x, y, z) }, extra || {}), root),
      text: (x, y, z, value, opts, extra) => setText(make('a-entity', Object.assign({ position: P(x, y, z) }, extra || {}), root), value, opts),
      person: (id, x, z, rotY, opts) => person(root, id, x, z, rotY, opts)
    };
  }

  // A little low-poly figure. Front of the figure faces +z.
  function person(parent, id, x, z, rotY, opts) {
    opts = opts || {};
    const c = COLORS[id];
    const el = make('a-entity', { position: P(x, 0, z), rotation: P(0, rotY || 0, 0), mover: opts.speed ? `speed: ${opts.speed}` : '' }, parent);
    const bob = make('a-entity', {}, el);
    const m = make('a-entity', {}, bob);
    const S = builder(m);

    if (id === 'vera') S.cone(0, 0.03, 0, 0.021, 0.009, 0.06, c);                 // dress
    else S.cyl(0, 0.03, 0, 0.013, 0.06, id === 'basil' ? '#26262b' : c);           // body

    S.ball(0, 0.074, 0, 0.014, '#efc7a2');                                          // head
    S.ball(-0.005, 0.077, 0.012, 0.0024, '#111');                                   // eyes
    S.ball( 0.005, 0.077, 0.012, 0.0024, '#111');

    if (id === 'edmund') S.ball(0, 0.083, -0.003, 0.012, '#e6e6e6');               // white hair
    if (id === 'vera')   S.ball(0, 0.086, -0.007, 0.009, '#3b1f12');               // bun
    if (id === 'ilsa') { S.ball(0, 0.079, -0.004, 0.0142, '#e8c872');              // blonde hair
                         S.box(0.019, 0.02, 0, 0.01, 0.014, 0.022, '#3a2a1a'); }   // medical bag
    if (id === 'basil') { S.box(0, 0.036, 0.0125, 0.008, 0.044, 0.002, '#ffffff'); // shirt front
                          S.box(0, 0.057, 0.0135, 0.014, 0.005, 0.003, c); }       // gold bow tie
    if (id === 'thorne') { S.cyl(0, 0.089, 0, 0.0155, 0.008, '#1e5631');           // cap
                           S.box(0, 0.067, 0.0135, 0.013, 0.003, 0.002, '#eeeeee'); } // moustache
    if (id === 'grey')   { S.cyl(0, 0.086, 0, 0.021, 0.002, '#5d4037');            // hat brim
                           S.cyl(0, 0.093, 0, 0.012, 0.013, '#5d4037'); }

    if (opts.lying) { m.setAttribute('rotation', '-90 0 0'); m.setAttribute('position', '0 0.014 0'); }

    if (opts.label !== false) {
      const tag = make('a-entity', {
        position: '0 0.118 0', 'face-camera': '',
        geometry: 'primitive: plane; width: 0.075; height: 0.02',
        material: 'shader: flat; color: #111418; opacity: 0.7; transparent: true'
      }, el);
      setText(tag, NAMES[id], { color: c, width: 0.12, wrapCount: 12 });
    }

    el._model = m;
    el._bob = bob;
    el._isPerson = true;
    return el;
  }

  // A potted fern (used twice - it hides an important clue).
  function fern(S, x, z, s) {
    const g = S.group(x, 0, z, { scale: P(s, s, s) });
    const F = S.at(g);
    F.cyl(0, 0.015, 0, 0.016, 0.03, '#b5652d');
    F.cyl(0, 0.0305, 0, 0.0145, 0.002, '#3b2a1d');
    for (let i = 0; i < 8; i++) {
      F.cone(0, 0.05, 0, 0.006, 0.0005, 0.045, i % 2 ? '#2e8b3a' : '#3fa34d', { rotation: P(38, i * 45, 0) });
    }
    return g;
  }

  // A basic room: floor plus low back and left walls so you can see inside.
  function room(S, floor, wall, opts) {
    opts = opts || {};
    S.box(0, 0.002, 0, 0.46, 0.004, 0.46, floor);
    const extra = opts.op ? { opacity: opts.op } : {};
    if (opts.back !== false) S.box(0, 0.05, -0.225, 0.46, 0.1, 0.01, wall, extra);
    if (opts.left !== false) S.box(-0.225, 0.05, 0, 0.01, 0.1, 0.46, wall, extra);
  }

  function bookRow(S, x0, y, z, count, alongZ) {
    const cols = ['#7a1f1f', '#1f4e7a', '#2f6b3a', '#a0782a', '#5a2d6b', '#444'];
    for (let j = 0; j < count; j++) {
      const h = 0.018 + (j * 7 % 5) * 0.002;
      if (alongZ) S.box(x0, y + h / 2, z + j * 0.012, 0.012, h, 0.009, cols[j % cols.length]);
      else        S.box(x0 + j * 0.012, y + h / 2, z, 0.009, h, 0.012, cols[j % cols.length]);
    }
  }

  // ---------- Sound (tiny Web Audio blips, no files needed) ----------
  const sfx = (() => {
    let ctx = null;
    function ac() {
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      } catch (e) { return null; }
    }
    function tone(f, d, type, vol, delay) {
      const c = ac(); if (!c) return;
      const t0 = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(vol || 0.05, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + d + 0.05);
    }
    return {
      click: () => tone(520, 0.08, 'triangle', 0.05),
      bell:  () => { tone(1320, 0.7, 'sine', 0.08); tone(1320, 0.7, 'sine', 0.08, 0.28); },
      good:  () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.35, 'triangle', 0.06, i * 0.13)),
      bad:   () => { tone(220, 0.35, 'sawtooth', 0.035); tone(160, 0.5, 'sawtooth', 0.035, 0.22); }
    };
  })();

  // =====================================================================
  //  COMPONENTS (each one is a "behavior" with init / tick, like lecture 2)
  // =====================================================================

  // Walks a figure along a list of [x, z] points, one step per frame.
  // Set el._path = [[x,z], ...] and optional el._done = callback.
  AFRAME.registerComponent('mover', {
    schema: { speed: { default: 0.08 } },          // metres per second (diorama scale)
    tick: function (t, dt) {
      const el = this.el, path = el._path;
      if (!path || !path.length) {
        if (this.moving) {
          this.moving = false;
          if (el._bob) el._bob.object3D.position.y = 0;
          const done = el._done; el._done = null;
          if (done) done(el);
        }
        return;
      }
      this.moving = true;
      const o = el.object3D;
      const tx = path[0][0], tz = path[0][1];
      const dx = tx - o.position.x, dz = tz - o.position.z;
      const dist = Math.hypot(dx, dz);
      const step = this.data.speed * Math.min(dt || 16, 50) / 1000;
      if (dist <= step) { o.position.x = tx; o.position.z = tz; path.shift(); }
      else {
        o.position.x += dx / dist * step;
        o.position.z += dz / dist * step;
        o.rotation.y = Math.atan2(dx, dz);          // face where we walk
      }
      if (el._bob) el._bob.object3D.position.y = Math.abs(Math.sin(t * 0.014)) * 0.006;
    }
  });

  // Gently pulses the size of something to draw attention to it.
  AFRAME.registerComponent('pulse', {
    tick: function (t) {
      const o = this.el.object3D;
      if (!this.base) this.base = o.scale.clone();
      const f = 1 + 0.12 * (0.5 + 0.5 * Math.sin(t * 0.009));
      o.scale.set(this.base.x * f, this.base.y * f, this.base.z * f);
    },
    remove: function () { if (this.base) this.el.object3D.scale.copy(this.base); }
  });

  // The yellow arrow that hovers over (and follows) whatever the narration is about.
  AFRAME.registerComponent('spot-arrow', {
    tick: function (t) {
      const target = this.el._target;
      if (!target || !target.object3D) return;
      const p = target.object3D.position;
      this.el.object3D.position.set(p.x, p.y + this.el._dy + Math.sin(t * 0.006) * 0.008, p.z);
    }
  });

  // Keeps name tags and notes turned towards the player.
  AFRAME.registerComponent('face-camera', {
    init: function () { this.v = new THREE.Vector3(); },
    tick: function () {
      const cam = this.el.sceneEl.camera;
      if (!cam) return;
      cam.getWorldPosition(this.v);
      this.el.object3D.lookAt(this.v);
    }
  });

  AFRAME.registerComponent('spin', {
    schema: { speed: { default: 0.25 } },
    tick: function (t, dt) { this.el.object3D.rotation.y += (dt || 16) / 1000 * this.data.speed; }
  });

  AFRAME.registerComponent('bob', {
    tick: function (t) {
      const o = this.el.object3D;
      if (this.y === undefined) this.y = o.position.y;
      o.position.y = this.y + Math.sin(t * 0.004) * 0.006;
    }
  });

  // Hover feedback for anything you can point at.
  AFRAME.registerComponent('hover-fx', {
    schema: { color: { default: '' }, scale: { default: 1.07 } },
    init: function () {
      const el = this.el;
      el.addEventListener('mouseenter', () => {
        el.object3D.scale.setScalar(this.data.scale);
        if (this.data.color) {
          this.base = el.getAttribute('material').color;
          el.setAttribute('material', 'color', this.data.color);
        }
      });
      el.addEventListener('mouseleave', () => {
        el.object3D.scale.setScalar(1);
        if (this.data.color && this.base) el.setAttribute('material', 'color', this.base);
      });
    }
  });


  // ---------- Mixed reality components ----------

  // Hidden evidence sparkles every few seconds so you can spot it across the room.
  AFRAME.registerComponent('twinkle', {
    init: function () { this.off = Math.random() * 3000; },
    tick: function (t) {
      const k = ((t + this.off) % 2600) / 2600;
      const s = k < 0.14 ? Math.sin(k / 0.14 * Math.PI) : 0;
      this.el.object3D.scale.setScalar(0.35 + s * 1.7);
    }
  });

  // Flies a collected card from the room back to its slot on your table.
  AFRAME.registerComponent('fly', {
    tick: function (t, dt) {
      const f = this.el._fly; if (!f) return;
      f.k = Math.min(1, f.k + (dt || 16) / f.dur);
      const e = f.k < 0.5 ? 2 * f.k * f.k : 1 - Math.pow(-2 * f.k + 2, 2) / 2;
      const o = this.el.object3D;
      o.position.lerpVectors(f.from, f.to, e);
      o.position.y += Math.sin(Math.PI * e) * 0.35;
      o.quaternion.slerpQuaternions(f.q0, f.q1, e);
      o.scale.setScalar(1 + (f.s1 - 1) * e);
      if (f.k >= 1) { this.el._fly = null; f.done(); }
    }
  });

  // Makes a life-size figure see-through once its meshes exist.
  AFRAME.registerComponent('ghost', {
    tick: function () {
      if (this.done) return;
      let n = 0;
      this.el.object3D.traverse(o => { if (o.isMesh) n++; });
      if (n < 6) return;
      this.el.object3D.traverse(o => {
        if (o.isMesh && o.material) {
          o.material = o.material.clone();
          o.material.transparent = true;
          o.material.opacity = 0.5;
          if (o.material.emissive) o.material.emissive.set('#1c2a44');
        }
      });
      this.done = true;
    }
  });

  // Reads the real room from WebXR plane detection every frame (Quest 3 Space Setup):
  // tables, walls, floor, doors, windows, couches... and turns each into an entity.
  AFRAME.registerComponent('real-world', {
    init: function () { this.m = new THREE.Matrix4(); this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.s = new THREE.Vector3(); },
    tick: function () {
      const scene = this.el, frame = scene.frame;
      let ref = null;
      if (frame && scene.is('ar-mode')) {
        ref = scene.renderer.xr.getReferenceSpace();
        const planes = frame.detectedPlanes;
        if (ref && planes) {
          planes.forEach(plane => {
            const rec = XRW.recs.get(plane);
            if (rec && rec.t === plane.lastChangedTime) return;
            const pose = frame.getPose(plane.planeSpace, ref);
            if (!pose) return;
            this.m.fromArray(pose.transform.matrix);
            this.m.decompose(this.p, this.q, this.s);
            let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
            for (const pt of plane.polygon) {
              minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
              minZ = Math.min(minZ, pt.z); maxZ = Math.max(maxZ, pt.z);
            }
            upsertPlane(plane, {
              label: (plane.semanticLabel || '').toLowerCase(), orientation: plane.orientation,
              pos: this.p.clone(), quat: this.q.clone(), minX, maxX, minZ, maxZ, t: plane.lastChangedTime
            });
          });
          XRW.recs.forEach((rec, key) => {
            if (!rec.fake && !planes.has(key)) { removeEl(rec.el); XRW.recs.delete(key); }
          });
        }
      }
      if (G.phase === 'place') updateReticle(frame, ref);
    }
  });

  // =====================================================================
  //  THE CASE
  // =====================================================================
  //  Solution (spoilers!): Dr. Ilsa Moreau rang the conservatory bell to
  //  pull Basil away from the tray, slipped through the side door, dosed
  //  the brandy with digitalis and buried the vial in the fern pot.
  // =====================================================================

  const SUSPECTS = [
    { id: 'vera', name: 'Vera Larkspur', role: "Edmund's niece",
      says: '"Yes, I was furious about the will. But I was on the phone to my lawyer from nine until nearly a quarter to ten. Ask the telephone exchange."',
      motive: 'Edmund was cutting her out of his will - tomorrow.' },
    { id: 'ilsa', name: 'Dr. Ilsa Moreau', role: 'The family doctor',
      says: '"I sat in the conservatory all evening with my book. I never left that room until Basil raised the alarm."',
      motive: 'Edmund wanted to discuss "missing clinic money" with her tomorrow.' },
    { id: 'basil', name: 'Basil', role: 'The butler',
      says: '"I poured the master\'s nightcap as always. The conservatory bell rang, so I left the tray in the hall for a few minutes. When I came back, I took it straight in."',
      motive: 'None known - but he served the poisoned drink.' },
    { id: 'thorne', name: 'Colonel Thorne', role: 'An old army friend',
      says: '"I was in the garden all night with a cigar. I never went near the study. Never."',
      motive: 'Gambling debts. Edmund refused him a loan at dinner.' }
  ];

  const CARD_ORDER = ['study', 'dinner', 'bell', 'conservatory', 'garden', 'library', 'fern'];

  const SCENES = {

    // ---------------- Intro diorama (not a card) ----------------
    manor: {
      build(S) {
        S.box(0, 0.002, 0, 0.46, 0.004, 0.46, '#355e2b');
        S.box(0, 0.0045, 0.14, 0.06, 0.001, 0.2, '#9b8f7a');               // path
        const house = S.group(0, 0, -0.03, { spin: 'speed: 0.2' });
        const H = S.at(house);
        H.box(0, 0.05, 0, 0.22, 0.1, 0.12, '#b9a58a');
        const roof = H.group(0, 0.13, 0, { scale: '1.32 1 0.72' });
        builder(roof).cone(0, 0, 0, 0.12, 0.002, 0.07, PAL.oxblood, { 'segments-radial': 4, rotation: '0 45 0' });
        H.box(0.07, 0.15, 0.0, 0.02, 0.05, 0.02, '#6b5a4a');               // chimney
        for (let i = 0; i < 4; i++) {
          H.box(-0.075 + i * 0.05, 0.075, 0.061, 0.022, 0.02, 0.002, '#ffd36b', { material: 'shader: flat; color: #ffd36b' });
          H.box(-0.075 + i * 0.05, 0.035, 0.061, 0.022, 0.02, 0.002, i === 1 ? '#4a2c1a' : '#ffd36b');
        }
        [[-0.17, 0.12], [0.17, 0.1], [-0.15, -0.16], [0.16, -0.15]].forEach(([x, z]) => {
          S.cyl(x, 0.02, z, 0.005, 0.04, '#5b3a29');
          S.ball(x, 0.055, z, 0.028, '#2d6a2f');
        });
      },
      steps: []
    },

    // ---------------- Card 1 ----------------
    study: {
      card: { title: 'The study', time: '10:00 PM', color: '#7d5a4f' },
      build(S, A, Pr) {
        room(S, '#5b3a29', '#7d5a4f');
        S.box(0.09, 0.06, -0.219, 0.08, 0.055, 0.003, '#a9d6ff', { opacity: 0.8 });     // window
        Pr.window = S.box(0.045, 0.06, -0.2, 0.003, 0.055, 0.04, '#d6ecff', { rotation: '0 -30 0', opacity: 0.7 });
        S.box(-0.13, 0.025, -0.16, 0.13, 0.05, 0.07, '#3e2417');                         // desk
        Pr.bottle = S.cyl(-0.17, 0.062, -0.16, 0.007, 0.022, '#c47f17');                 // Edmund's medicine
        S.cyl(-0.17, 0.0745, -0.16, 0.0075, 0.004, '#f2f2f2');                           // sealed cap
        Pr.letter = S.box(-0.1, 0.051, -0.15, 0.035, 0.002, 0.025, '#fdfdf5');
        S.box(0.03, 0.016, -0.1, 0.07, 0.032, 0.06, '#7b2d26');                          // armchair
        S.box(0.03, 0.05, -0.128, 0.07, 0.04, 0.01, '#7b2d26');
        S.box(-0.205, 0.05, 0.09, 0.025, 0.1, 0.13, '#3b2416');                          // bookcase
        bookRow(S, -0.19, 0.022, 0.035, 9, true);
        bookRow(S, -0.19, 0.062, 0.035, 9, true);
        S.cyl(-0.218, 0.075, -0.06, 0.016, 0.004, '#f5f0e1', { rotation: '0 0 90' });     // clock
        A.edmund = S.person('edmund', 0.06, 0.09, 20, { lying: true });
        Pr.glass = S.cyl(0.11, 0.008, 0.11, 0.0055, 0.016, '#e8f7ff', { rotation: '90 40 0', opacity: 0.85 });
        S.cyl(0.115, 0.0045, 0.125, 0.018, 0.001, '#5c1a10');                             // spilled brandy
        Pr.prints = S.group(0.12, 0.0045, -0.1);                                          // muddy footprints
        const F = S.at(Pr.prints);
        for (let i = 0; i < 7; i++) F.box(i % 2 ? 0.008 : -0.008, 0, -0.09 + i * 0.028, 0.008, 0.001, 0.014, '#3a2614');
        A.basil = S.person('basil', 0.2, 0.2, -135);
      },
      steps: [
        { t: '10:00 PM. Basil knocks, then enters the study to collect the empty brandy tray.', run: c => c.walk('basil', [[0.17, 0.17]]) },
        { t: 'Edmund Larkspur lies dead beside his armchair. His brandy glass has spilled across the floor.', run: c => c.spot('glass') },
        { t: 'The coroner\'s verdict: a fatal dose of digitalis - a heart medicine - dissolved in the brandy.', run: c => c.spot('edmund', 0.1) },
        { t: 'Edmund\'s own digitalis bottle sits on the desk, still sealed and full. This was no accident.', run: c => c.spot('bottle') },
        { t: 'Muddy footprints lead in from the open window towards the body... and back out again.', run: c => c.spot('prints', 0.05) },
        { t: 'A note on the desk in Edmund\'s handwriting: "Phone Inspector Grey re: the clinic accounts."', run: c => c.spot('letter') }
      ]
    },

    // ---------------- Card 2 ----------------
    dinner: {
      card: { title: 'Dinner', time: '8:00 PM', color: '#9a7b5f' },
      build(S, A, Pr) {

  //  GAME

  const G = { phase: 'hunt', mode: 'investigate', seen: new Set(), found: new Set(['study']),
              accused: null, attempts: 0, tableRec: null, trailDone: false, origins: {} };
  const XRW = { recs: new Map(), hitSources: new Map(), aim: null, session: null, statusTimer: null };

  let root, content, worldEl, panelTitle, panelBody, panelFoot, accuseBtn, hud, hudBody, hudScanBtn, reticle;
  const cardEls = {}, suspectFigs = {}, hidden = {};
  let spots = [], roomFx = [];

  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const DEFAULT_ROOT = { pos: V3(0, 1.12, -1.0), rotY: 0 };
  const HIDDEN_CARDS = CARD_ORDER.filter(id => id !== 'study');

  // Which real things each card likes to hide on (Quest semantic labels).
  const PREF = {
    dinner: ['table', 'couch', 'sofa', 'bed'],
    bell: ['door'],
    conservatory: ['plant', 'window'],
    garden: ['window', 'door'],
    library: ['storage', 'shelf', 'screen', 'bed', 'couch'],
    fern: ['plant', 'floor']
  };
  function where(label) {
    const L = label || '';
    if (L.includes('door')) return 'by a door';
    if (L.includes('window')) return 'at a window';
    if (L.includes('floor')) return 'on the floor';
    if (L.includes('table') || L.includes('desk')) return 'on a table';
    if (L.includes('couch') || L.includes('sofa')) return 'on the couch';
    if (L.includes('bed')) return 'on the bed';
    if (L.includes('plant')) return 'by a plant';
    if (L.includes('storage') || L.includes('shelf')) return 'on some storage';
    if (L.includes('screen')) return 'by a screen';
    if (L.includes('wall')) return 'on a wall';
    return 'somewhere around the table';
  }

  function removeEl(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }
  const sceneEl = () => document.querySelector('a-scene');
  const inXR = () => sceneEl().is('ar-mode') || sceneEl().is('vr-mode');
  function headPos() { const c = sceneEl().camera; c.updateWorldMatrix(true, false); return c.getWorldPosition(V3()); }
  function headFwd() { const c = sceneEl().camera; const f = c.getWorldDirection(V3()); f.y = 0; if (f.lengthSq() < 1e-4) f.set(0, 0, -1); return f.normalize(); }
  function setRayTargets(sel) {
    sceneEl().setAttribute('raycaster', 'objects', sel);
    ['#rightHand', '#leftHand'].forEach(s => document.querySelector(s).setAttribute('raycaster', 'objects', sel));
  }
  const foundText = () => `Evidence found: ${G.found.size} of ${CARD_ORDER.length}`;

  function setPanel(title, body, foot) {
    if (title !== null) panelTitle.setAttribute('text', 'value', title);
    if (body !== null)  panelBody.setAttribute('text', 'value', body);
    if (foot !== null && foot !== undefined) panelFoot.setAttribute('text', 'value', foot);
  }

  // ---------- Real-world surfaces ----------
  function planeWorld(rec, x, z) { return V3(x, 0, z).applyQuaternion(rec.quat).add(rec.pos); }

  function surfaceColor(rec) {
    const L = rec.label || '';
    if (L.includes('door')) return '#ff9f68';
    if (L.includes('window')) return '#9fe8ff';
    if (rec.orientation === 'vertical') return '#6fa8ff';
    if (L.includes('floor') || rec.pos.y < 0.2) return '#4cc38a';
    return '#f2c94c';                                      // tables & other flat things
  }

  function upsertPlane(key, d) {
    let rec = XRW.recs.get(key);
    if (!rec) {
      const el = make('a-entity', {}, worldEl);
      const surf = make('a-plane', { class: 'surface', rotation: '-90 0 0',
        material: 'shader: flat; transparent: true; opacity: 0.22; side: double' }, el);
      const tag = make('a-entity', { 'face-camera': '' }, el);
      rec = { key, el, surf, tag };
      surf._rec = rec;
      surf.addEventListener('click', e => onSurfaceClick(rec, e));
      XRW.recs.set(key, rec);
    }
    Object.assign(rec, d);
    const e = new THREE.Euler().setFromQuaternion(d.quat, 'YXZ');
    rec.el.setAttribute('position', { x: d.pos.x, y: d.pos.y, z: d.pos.z });
    rec.el.setAttribute('rotation', { x: THREE.MathUtils.radToDeg(e.x), y: THREE.MathUtils.radToDeg(e.y), z: THREE.MathUtils.radToDeg(e.z) });
    rec.w = Math.max(0.05, d.maxX - d.minX); rec.d = Math.max(0.05, d.maxZ - d.minZ);
    rec.cx = (d.minX + d.maxX) / 2; rec.cz = (d.minZ + d.maxZ) / 2;
    rec.surf.setAttribute('width', rec.w);
    rec.surf.setAttribute('height', rec.d);
    rec.surf.setAttribute('position', P(rec.cx, 0.003, rec.cz));
    rec.surf.setAttribute('material', 'color', surfaceColor(rec));
    rec.tag.setAttribute('position', P(rec.cx, 0.05, rec.cz));
    setText(rec.tag, rec.label || (rec.orientation === 'vertical' ? 'wall' : 'surface'), { color: surfaceColor(rec), width: 0.5, wrapCount: 14 });
    rec.center = planeWorld(rec, rec.cx, rec.cz);
    rec.normal = V3(0, 1, 0).applyQuaternion(d.quat).normalize();
    rec.el.setAttribute('visible', G.phase === 'place');
  }

  function floorY() {
    let y = 0, best = 1e9;
    XRW.recs.forEach(r => { if (r.orientation !== 'vertical' && ((r.label || '').includes('floor') || r.center.y < 0.25) && r.center.y < best) { best = r.center.y; y = r.center.y; } });
    return best < 1e9 ? y : 0;
  }
  function findRec(word) {
    for (const r of XRW.recs.values()) if ((r.label || '').includes(word)) return r;
    return null;
  }
  // A point on the floor just in front of a real door / window (toward the table).
  function floorPointNear(rec, rootPos, out) {
    const p = rec.center.clone();
    const n = rec.normal.clone(); n.y = 0;
    if (n.lengthSq() < 1e-4) n.copy(rootPos).sub(p).setY(0);
    n.normalize();
    if (n.dot(V3(rootPos.x - p.x, 0, rootPos.z - p.z)) < 0) n.negate();
    p.addScaledVector(n, out); p.y = floorY();
    return p;
  }

  // ---------- Placing the crime scene on your real table ----------
  function updateReticle(frame, ref) {
    let hit = null;
    const rays = [document.querySelector('#rightHand'), document.querySelector('#leftHand'), sceneEl()];
    for (const r of rays) {
      const rc = r.components && r.components.raycaster;
      if (!rc || !rc.intersections) continue;
      const it = rc.intersections.find(i => i.object && i.object.el && i.object.el.classList.contains('surface'));
      if (it) { const rec = it.object.el._rec; hit = { point: it.point.clone(), rec, flat: rec.orientation !== 'vertical' }; break; }
    }
    if (!hit && frame && ref) {
      XRW.hitSources.forEach(src => {
        if (hit || !src) return;
        const res = frame.getHitTestResults(src);
        if (!res.length) return;
        const pose = res[0].getPose(ref);
        if (!pose) return;
        const p = pose.transform.position, o = pose.transform.orientation;
        const up = V3(0, 1, 0).applyQuaternion(new THREE.Quaternion(o.x, o.y, o.z, o.w));
        hit = { point: V3(p.x, p.y, p.z), rec: null, flat: up.y > 0.7, hitTest: true };
      });
    }
    XRW.aim = hit;
    if (hit) {
      reticle.object3D.visible = true;
      reticle.object3D.position.set(hit.point.x, hit.point.y + 0.006, hit.point.z);
      reticle._ring.setAttribute('material', 'color', hit.flat ? '#f2c94c' : '#ff6b6b');
    } else reticle.object3D.visible = false;
  }

  function hudSay(msg) { hudBody.setAttribute('text', 'value', msg); }
  function hudStatus() {
    if (G.phase !== 'place') return;
    const recs = [...XRW.recs.values()];
    if (recs.length) {
      const labels = [...new Set(recs.map(r => r.label || (r.orientation === 'vertical' ? 'wall' : 'surface')))];
      hudSay(`I can see ${recs.length} real surfaces in your room: ${labels.join(', ')}.\n\nPoint at your real table or desk (outlined in gold) and pull the trigger to set up the crime scene on it.`);
    } else {
      hudSay('Looking for your room...\n\nPoint at a real table or desk and pull the trigger. If no surfaces light up, press "Scan my room" (or run Space Setup in Quest settings), or use "Set up in front of me".');
    }
  }

  function positionHud() {
    const h = headPos(), f = headFwd();
    hud.object3D.position.set(h.x + f.x * 1.0, h.y - 0.12, h.z + f.z * 1.0);
    hud.object3D.rotation.set(0, Math.atan2(-f.x, -f.z), 0);
  }

  function beginPlacement() {
    G.phase = 'place';
    pauseScene();
    root.setAttribute('visible', false);
    root.object3D.position.y = -100;               // keep it out of the laser's way
    XRW.recs.forEach(r => r.el.setAttribute('visible', true));
    setRayTargets('.clickable, .surface');
    positionHud();
    hud.setAttribute('visible', true);
    hudStatus();
    clearInterval(XRW.statusTimer);
    XRW.statusTimer = setInterval(hudStatus, 800);
  }

  function onSurfaceClick(rec, e) {
    if (G.phase !== 'place') return;
    if (rec.orientation === 'vertical') { hudSay('That is a wall. Point at a flat surface, like a table or desk, and pull the trigger.'); sfx.bad(); return; }
    placeAt(e.detail.intersection.point.clone(), rec);
  }

  function placeInFront() {
    if (G.phase !== 'place') return;
    const h = headPos(), f = headFwd();
    placeAt(V3(h.x + f.x * 0.8, h.y - 0.55, h.z + f.z * 0.8), null);
  }

  function placeAt(point, rec) {
    if (G.phase !== 'place') return;
    sfx.good();
    clearInterval(XRW.statusTimer);
    const h = headPos();
    const toUser = V3(h.x - point.x, 0, h.z - point.z);
    if (toUser.lengthSq() < 1e-4) toUser.set(0, 0, 1);
    root.object3D.position.copy(point);
    root.object3D.rotation.set(0, Math.atan2(toUser.x, toUser.z), 0);   // the table faces you
    root.setAttribute('visible', true);
    hud.setAttribute('visible', false); hud.object3D.position.y = -100;
    reticle.object3D.visible = false;
    XRW.recs.forEach(r => r.el.setAttribute('visible', false));
    setRayTargets('.clickable');
    G.tableRec = rec;
    G.phase = 'hunt';
    if (!G.started) resetGame();
    else setPanel('Crime scene moved', 'Your evidence is still hidden where it was. Carry on investigating.', foundText());
  }

  // ---------- Hiding the evidence in your real room ----------
  function computeSpots(ids) {
    root.object3D.updateMatrixWorld(true);
    const rootPos = root.object3D.getWorldPosition(V3());
    const cands = [];
    XRW.recs.forEach(rec => {
      if (rec === G.tableRec) return;
      const lab = rec.label || '';
      if (rec.orientation === 'vertical') {
        const corners = [[rec.minX, rec.minZ], [rec.maxX, rec.minZ], [rec.maxX, rec.maxZ], [rec.minX, rec.maxZ]].map(([x, z]) => planeWorld(rec, x, z));
        const minY = Math.min(...corners.map(c => c.y)), maxY = Math.max(...corners.map(c => c.y));
        if (maxY - minY < 0.3) return;
        let y = THREE.MathUtils.clamp(lab.includes('door') ? 1.15 : 1.3, minY + 0.2, maxY - 0.2);
        if (minY + 0.2 > maxY - 0.2) y = (minY + maxY) / 2;
        const ax = V3(1, 0, 0).applyQuaternion(rec.quat), az = V3(0, 0, 1).applyQuaternion(rec.quat);
        const useX = Math.abs(ax.y) < Math.abs(az.y);
        const tan = (useX ? ax : az).setY(0).normalize();
        const half = (useX ? rec.w : rec.d) / 2;
        const n = rec.normal.clone().setY(0).normalize();
        if (n.dot(V3(rootPos.x - rec.center.x, 0, rootPos.z - rec.center.z)) < 0) n.negate();
        (half > 0.7 ? [-0.45, 0.45] : [0]).forEach(f => {
          const p = rec.center.clone().addScaledVector(tan, f * half);
          p.y = y; p.addScaledVector(n, 0.02);
          cands.push({ pos: p, normal: n.clone(), kind: 'wall', label: lab || 'wall' });
        });
      } else {
        const isFloor = lab.includes('floor') || rec.center.y < 0.2;
        if (lab.includes('ceiling') || rec.center.y > 2.0) return;
        if (isFloor) {
          [[0.25, 0.25], [0.75, 0.3], [0.3, 0.75], [0.7, 0.72], [0.5, 0.15], [0.5, 0.85]].forEach(([fx, fz]) => {
            const p = planeWorld(rec, rec.minX + fx * rec.w, rec.minZ + fz * rec.d); p.y += 0.01;
            cands.push({ pos: p, normal: V3(0, 1, 0), kind: 'flat', label: 'floor' });
          });
        } else {
          const p = rec.center.clone(); p.y += 0.01;
          cands.push({ pos: p, normal: V3(0, 1, 0), kind: 'flat', label: lab || 'surface' });
        }
      }
    });
    const good = cands.filter(c => {
      const d = Math.hypot(c.pos.x - rootPos.x, c.pos.z - rootPos.z);
      return d > 0.75 && d < 5;
    });
    const chosen = [], out = {}, used = {};
    const minDist = c => chosen.reduce((m, o) => Math.min(m, o.pos.distanceTo(c.pos)), 3);
    ids.forEach((id, i) => {
      let pick = -1;
      for (const p of (PREF[id] || [])) { pick = good.findIndex(c => c.label.includes(p) && minDist(c) > 0.35); if (pick >= 0) break; }
      if (pick < 0) {
        let best = -1, bs = -1e9;
        good.forEach((c, j) => { if (minDist(c) <= 0.35) return; const s = minDist(c) - (used[c.label] || 0) * 2; if (s > bs) { bs = s; best = j; } });
        pick = best;
      }
      let c;
      if (pick >= 0) c = good.splice(pick, 1)[0];
      else c = ringSpot(i, ids.length, rootPos);
      c.where = where(c.label);
      used[c.label] = (used[c.label] || 0) + 1;
      chosen.push(c); out[id] = c;
    });
    return out;
  }

  // Fallback when the room has not been scanned: a ring around the table, at
  // floor, waist and eye height, so you still have to turn and walk around.
  function ringSpot(i, n, rootPos) {
    const a = (i / n) * Math.PI * 2 + 0.5;
    const r = 1.3 + (i % 3) * 0.35;
    const y = [0.02, 0.85, 1.45][i % 3];
    const p = V3(rootPos.x + Math.sin(a) * r, y, rootPos.z + Math.cos(a) * r);
    const nrm = V3(rootPos.x - p.x, 0, rootPos.z - p.z).normalize();
    return { pos: p, normal: i % 3 === 0 ? V3(0, 1, 0) : nrm, kind: i % 3 === 0 ? 'flat' : 'wall', label: 'nearby' };
  }

  function makeHiddenCard(id, spot) {
    const sc = SCENES[id];
    const tmp = new THREE.Object3D(); tmp.rotation.order = 'YXZ';
    const rootPos = root.object3D.getWorldPosition(V3());
    if (spot.kind === 'flat') {
      tmp.rotation.set(-Math.PI / 2, Math.atan2(rootPos.x - spot.pos.x, rootPos.z - spot.pos.z) + Math.PI, 0);
    } else {
      tmp.position.copy(spot.pos);
      tmp.lookAt(spot.pos.clone().add(spot.normal));
    }
    const deg = r => THREE.MathUtils.radToDeg(r);
    const el = make('a-entity', {
      position: P(spot.pos.x, spot.pos.y, spot.pos.z),
      rotation: P(deg(tmp.rotation.x), deg(tmp.rotation.y), deg(tmp.rotation.z)), fly: ''
    }, worldEl);
    const frame = make('a-box', { width: 0.14, height: 0.19, depth: 0.006, color: PAL.paper, opacity: 0.12, transparent: true, class: 'clickable' }, el);
    const face = make('a-entity', { visible: false }, frame);
    make('a-plane', { position: '0 0.025 0.0035', width: 0.12, height: 0.11, material: `shader: flat; color: ${sc.card.color}` }, face);
    setText(make('a-entity', { position: '0 0.025 0.005' }, face), String(CARD_ORDER.indexOf(id) + 1), { width: 0.5, wrapCount: 8, color: '#fffaf0' });
    setText(make('a-entity', { position: '0 -0.06 0.0045' }, face), `Evidence: ${sc.card.title}\nWalk up and pull the trigger`, { width: 0.13, wrapCount: 18, color: '#2a2018' });
    make('a-sphere', { radius: 0.02, position: '0.06 0.085 0.01', 'segments-width': 8, 'segments-height': 6, material: 'shader: flat; color: #fff4b0; opacity: 0.9; transparent: true', twinkle: '' }, frame);
    frame.addEventListener('raycaster-intersected', () => revealHidden(id));
    frame.addEventListener('click', () => tryCollect(id));
    hidden[id] = { el, frame, face, spot, revealed: false };
  }

  // Lecture 4: 'raycaster-intersected' fires when your laser touches it.
  function revealHidden(id) {
    const h = hidden[id];
    if (!h || h.revealed || G.phase !== 'hunt') return;
    h.revealed = true;
    h.frame.setAttribute('material', 'opacity', 1);
    h.face.setAttribute('visible', true);
    h.frame.setAttribute('pulse', '');
    sfx.click();
  }

  function floatNote(anchor, msg) {
    const p = anchor.object3D.getWorldPosition(V3());
    const n = make('a-entity', { position: P(p.x, p.y + 0.17, p.z), 'face-camera': '',
      geometry: 'primitive: plane; width: 0.38; height: 0.07',
      material: 'shader: flat; color: #111418; opacity: 0.85; transparent: true' }, worldEl);
    setText(n, msg, { width: 0.36, wrapCount: 26, color: '#f2c94c' });
    setTimeout(() => removeEl(n), 2200);
  }

  function tryCollect(id) {
    const h = hidden[id];
    if (!h || G.phase !== 'hunt' || G.found.has(id) || h.flying) return;
    revealHidden(id);
    if (inXR() && headPos().distanceTo(h.el.object3D.getWorldPosition(V3())) > 1.6) {
      floatNote(h.frame, 'Walk closer to pick this up');
      return;
    }
    h.flying = true;
    h.frame.classList.remove('clickable');
    h.frame.removeAttribute('pulse');
    G.origins[id] = h.el.object3D.getWorldPosition(V3());
    const slot = cardEls[id];
    slot.object3D.updateMatrixWorld(true);
    h.el._fly = {
      k: 0, dur: 1300, s1: 0.1 / 0.14,
      from: h.el.object3D.position.clone(), to: slot.object3D.getWorldPosition(V3()),
      q0: h.el.object3D.quaternion.clone(), q1: slot.object3D.getWorldQuaternion(new THREE.Quaternion()),
      done: () => { removeEl(h.el); markFound(id); }
    };
    sfx.click();
  }

  function markFound(id) {
    G.found.add(id);
    updateSlot(id);
    sfx.good();
    if (G.mode === 'investigate') {
      G.seen.add(id); updateSlot(id);
      playScene(id);
    } else setPanel(null, null, foundText());
  }

  function updateSlot(id) {
    const f = cardEls[id], sc = SCENES[id], found = G.found.has(id), i = CARD_ORDER.indexOf(id);
    f.setAttribute('color', found ? (G.seen.has(id) ? PAL.seen : PAL.paper) : '#33433a');
    f._photo.setAttribute('visible', found);
    f._num.setAttribute('text', 'value', found ? String(i + 1) : '?');
    f._cap.setAttribute('text', { value: found ? `${sc.card.title}\n${sc.card.time}` : 'Hidden in\nyour room', color: found ? '#2a2018' : '#c9d3c9' });
  }

  function clearRoomFx() {
    roomFx.forEach(removeEl); roomFx = [];
    Object.values(hidden).forEach(h => removeEl(h.el));
    for (const k in hidden) delete hidden[k];
  }

  // ---------- The story spills into your room ----------
  // Thorne's muddy boot prints appear on YOUR floor, from YOUR window to the table.
  function muddyTrail() {
    if (G.trailDone) return;
    G.trailDone = true;
    const rootPos = root.object3D.getWorldPosition(V3());
    const win = findRec('window') || findRec('door');
    let from;
    if (win) from = floorPointNear(win, rootPos, 0.3);
    else if (G.origins.garden) from = G.origins.garden.clone();
    else { const f = headFwd(); from = V3(rootPos.x + f.x * 2.2, 0, rootPos.z + f.z * 2.2); }
    const fy = floorY();
    from.y = fy;
    const to = V3(rootPos.x, fy, rootPos.z);
    const dir = to.clone().sub(from); dir.y = 0;
    const len = dir.length() - 0.45;
    if (len < 0.3) return;
    dir.normalize();
    const side = V3(-dir.z, 0, dir.x);
    const yaw = THREE.MathUtils.radToDeg(Math.atan2(dir.x, dir.z));
    const count = Math.floor(len / 0.33);
    for (let i = 0; i < count; i++) {
      const p = from.clone().addScaledVector(dir, i * 0.33).addScaledVector(side, i % 2 ? 0.09 : -0.09);
      setTimeout(() => {
        const fp = make('a-box', { position: P(p.x, fy + 0.003, p.z), rotation: P(0, yaw, 0), width: 0.1, height: 0.004, depth: 0.27,
          color: '#3b2a1a', opacity: 0.85, transparent: true }, worldEl);
        roomFx.push(fp);
      }, i * 160);
    }
  }

  // During the reveal, a life-size ghost of the killer crosses your real room.
  function ghostWalk() {
    const rootPos = root.object3D.getWorldPosition(V3());
    const door = findRec('door') || findRec('window');
    let from;
    if (door) from = floorPointNear(door, rootPos, 0.4);
    else { const f = headFwd(); from = V3(rootPos.x - f.z * 2.2, 0, rootPos.z + f.x * 2.2); }
    const fy = floorY();
    const away = from.clone().sub(rootPos).setY(0);
    if (away.length() < 0.8) away.setLength(0.8);
    const to = rootPos.clone().add(away.clone().setLength(0.6));
    const g = person(worldEl, 'ilsa', from.x, from.z, 0, { label: false, speed: 0.6 });
    g.setAttribute('position', P(from.x, fy, from.z));
    g.setAttribute('scale', '19 19 19');
    g.setAttribute('ghost', '');
    g._bob = null;
    g._path = [[to.x, to.z]];
    g._done = () => setTimeout(() => { g._path = [[from.x, from.z]]; g._done = () => removeEl(g); }, 2500);
    roomFx.push(g);
  }

  // ---------- Highlights on the diorama ----------
  function addSpot(target, dy) {
    if (!target) return;
    target.setAttribute('pulse', '');
    const a = make('a-cone', {
      'radius-bottom': 0.012, 'radius-top': 0.001, height: 0.03, rotation: '180 0 0',
      material: 'shader: flat; color: #ffd166', 'spot-arrow': ''
    }, content);
    a._target = target;
    a._dy = dy || (target._isPerson ? 0.16 : 0.06);
    spots.push({ target, a });
  }
  function clearSpots() {
    spots.forEach(s => { s.target.removeAttribute('pulse'); removeEl(s.a); });
    spots = [];
  }

  // ---------- Scene playback ----------
  function makeCtx(A, Pr) {
    const get = n => A[n] || Pr[n];
    return {
      A, P: Pr,
      walk(n, pts, done) { const el = get(n); el.setAttribute('visible', true); el._path = pts.map(p => p.slice()); el._done = done || null; },
      face(n, deg) { get(n).object3D.rotation.y = THREE.MathUtils.degToRad(deg); },
      show(n) { get(n).setAttribute('visible', true); },
      spot(n, dy) { addSpot(get(n), dy); },
      fall(n) {
        const m = get(n)._model;
        m.setAttribute('animation__r', { property: 'rotation', to: '90 0 0', dur: 700, easing: 'easeInQuad' });
        m.setAttribute('animation__p', { property: 'position', to: '0 0.014 0', dur: 700, easing: 'easeInQuad' });
      },
      hop(n) {
        get(n)._bob.setAttribute('animation__hop', { property: 'position', from: '0 0 0', to: '0 0.018 0', dur: 180, dir: 'alternate', loop: 4, easing: 'easeOutQuad' });
      },
      anim(el, prop, to, dur) { el.setAttribute('animation__' + prop, { property: prop, to: to, dur: dur, easing: 'easeInOutQuad' }); },
      trail: muddyTrail,
      ghost: ghostWalk
    };
  }

  function clearStage() {
    clearTimeout(run.timer);
    clearSpots();
    while (content.firstChild) content.removeChild(content.firstChild);
  }

  function playScene(id, onEnd) {
    clearStage();
    const sc = SCENES[id];
    const A = {}, Pr = {};
    sc.build(builder(content), A, Pr);
    run.id = id; run.steps = sc.steps; run.i = -1; run.onEnd = onEnd || null;
    run.ctx = makeCtx(A, Pr);
    if (sc.steps.length) run.timer = setTimeout(nextStep, 350);
  }

  function sceneTitle(id) {
    const sc = SCENES[id];
    if (sc.card) return `Evidence ${CARD_ORDER.indexOf(id) + 1}: ${sc.card.title}, ${sc.card.time}`;
    return sc.title || '';
  }

  function nextStep() {
    clearTimeout(run.timer);
    if (!run.steps.length || run.i >= run.steps.length - 1) {
      if (run.i >= run.steps.length - 1 && run.steps.length) finishScene();
      return;
    }
    clearSpots();
    run.i++;
    const st = run.steps[run.i];
    setPanel(sceneTitle(run.id), st.t, `Step ${run.i + 1} of ${run.steps.length}   |   ${foundText()}   |   Next step skips ahead`);
    try { st.run(run.ctx); } catch (e) { console.error(e); }
    const dur = Math.max(4200, st.t.length * 62);
    run.timer = setTimeout(() => { if (run.i >= run.steps.length - 1) finishScene(); else nextStep(); }, dur);
  }

  function finishScene() {
    clearTimeout(run.timer);
    run.i = run.steps.length;
    if (run.onEnd) { const f = run.onEnd; run.onEnd = null; f(); return; }
    const left = CARD_ORDER.length - G.found.size;
    setPanel(null, null, `End of this card   |   ${foundText()}   |   ` + (left ? 'Keep searching your room' : 'All evidence found'));
  }

  function pauseScene() { clearTimeout(run.timer); }

  // ---------- Player actions ----------
  function onCard(id) {
    if (G.phase !== 'hunt') return;
    sfx.click();
    if (G.mode === 'pickEvidence') {
      if (!G.found.has(id)) { setPanel(null, 'You have not found that evidence yet. Pick a card you have collected.', null); return; }
      verdict(id); return;
    }
    if (G.mode !== 'investigate') return;
    if (!G.found.has(id)) {
      setPanel(`Still hidden: ${SCENES[id].card.title}`,
        'This piece of evidence is somewhere in your room. Sweep your laser around: it lights up when the beam touches it. Press Hint for directions.',
        foundText());
      return;
    }
    G.seen.add(id); updateSlot(id);
    playScene(id);
  }

  function onSuspect(id) {
    if (G.phase !== 'hunt') return;
    sfx.click();
    const s = SUSPECTS.find(x => x.id === id);
    if (G.mode === 'pickSuspect') {
      G.accused = id;
      G.mode = 'pickEvidence';
      Object.values(suspectFigs).forEach(f => f.removeAttribute('pulse'));
      suspectFigs[id].setAttribute('pulse', '');
      CARD_ORDER.filter(c => G.found.has(c)).forEach(c => cardEls[c].setAttribute('pulse', ''));
      setPanel(`You accuse ${s.name}`,
        `Now prove it. Select the one evidence card on your table that breaks ${s.name.split(' ')[0]}'s story or ties them to the poison.`,
        'Press Cancel to back out');
      return;
    }
    if (G.mode !== 'investigate') return;
    pauseScene();
    setPanel(`${s.name}, ${s.role.toLowerCase()}`, `${s.says}\n\nMotive: ${s.motive}`,
      run.i >= 0 && run.i < run.steps.length ? 'Press Next step to carry on with the scene' : foundText());
  }

  function onHint() {
    if (G.phase !== 'hunt') return;
    sfx.click();
    const missing = HIDDEN_CARDS.filter(id => !G.found.has(id) && hidden[id]);
    if (!missing.length) { setPanel('All evidence found', 'Every card is on your table. Work out who did it, then press Accuse.', foundText()); return; }
    pauseScene();
    const head = headPos(), fwd = headFwd();
    const lines = missing.map(id => {
      const h = hidden[id];
      const p = h.el.object3D.getWorldPosition(V3());
      const v = p.clone().sub(head);
      const dist = Math.hypot(v.x, v.z);
      const s = fwd.z * v.x - fwd.x * v.z, dot = fwd.x * v.x + fwd.z * v.z;
      const deg = THREE.MathUtils.radToDeg(Math.atan2(-s, dot));
      const dir = Math.abs(deg) < 35 ? 'ahead of you' : Math.abs(deg) > 115 ? 'behind you' : deg > 0 ? 'to your right' : 'to your left';
      const hgt = p.y < 0.35 ? ', low down' : p.y > 1.6 ? ', up high' : '';
      return `${SCENES[id].card.title}: ${dist.toFixed(1)} m ${dir}${hgt} (${h.spot.where})`;
    });
    setPanel('Where to look', lines.join('\n'), `${foundText()}   |   Directions are from where you are standing now`);
  }

  function endAccusationUI() {
    Object.values(suspectFigs).forEach(f => f.removeAttribute('pulse'));
    Object.values(cardEls).forEach(c => c.removeAttribute('pulse'));
  }

  function onAccuse() {
    if (G.phase !== 'hunt') return;
    sfx.click();
    if (G.mode === 'solved') { resetGame(); return; }
    if (G.mode === 'pickSuspect' || G.mode === 'pickEvidence') {
      G.mode = 'investigate';
      endAccusationUI();
      accuseBtn.setAttribute('text', 'value', 'Accuse');
      setPanel('Accusation cancelled', 'Keep investigating. Search your room, replay a card, or question a suspect.', foundText());
      return;
    }
    pauseScene();
    G.mode = 'pickSuspect';
    accuseBtn.setAttribute('text', 'value', 'Cancel');
    Object.values(suspectFigs).forEach(f => f.setAttribute('pulse', ''));
    setPanel('Who killed Edmund Larkspur?', 'Point at the suspect you accuse and select them.\n\nYou only win by naming the killer AND the evidence that proves it.', 'Press Cancel to back out');
  }

  const REBUTTALS = {
    vera: 'The telephone exchange shows Vera\'s call ran unbroken from 9:02 to 9:41. She never left the library while the drink sat in the hall.',
    thorne: 'Thorne lied - he did climb into the study. But only after he watched Edmund drink and collapse. The poison was already in the glass.',
    basil: 'The cook watched Basil pour the drink from a fresh decanter. And someone else rang the conservatory bell to get him away from that tray. Basil was the one being fooled.'
  };

  function verdict(cardId) {
    G.attempts++;
    endAccusationUI();
    const s = SUSPECTS.find(x => x.id === G.accused);
    if (G.accused === 'ilsa' && (cardId === 'conservatory' || cardId === 'fern')) {
      G.mode = 'solved';
      sfx.good();
      accuseBtn.setAttribute('text', 'value', 'Play again');
      setPanel('Case closed',
        cardId === 'conservatory'
          ? 'Dr. Moreau swore she never left the conservatory - yet when Basil answered its bell at 9:18, her chair was empty and the side door to the hall table was ajar.'
          : 'A doctor\'s dispensing vial of digitalis, buried right beside the unattended tray - while Edmund\'s own bottle stayed sealed. Only Dr. Moreau carried one.',
        'Watch what really happened... and look around your room');
      setTimeout(() => playScene('reveal', () => {
        setPanel('Case closed: Dr. Ilsa Moreau did it',
          'She rang the conservatory bell to pull Basil away, slipped through the side door, poisoned the brandy with digitalis and buried the vial in the fern pot. Her lie about never leaving the conservatory gave her away.\n\n' +
          `Solved with ${G.attempts} accusation${G.attempts === 1 ? '' : 's'}, after finding ${G.found.size} of ${CARD_ORDER.length} pieces of evidence.`,
          'Press Play again for a fresh search of your room');
      }), 3500);
      return;
    }
    G.mode = 'investigate';
    accuseBtn.setAttribute('text', 'value', 'Accuse');
    sfx.bad();
    if (G.accused === 'ilsa') {
      setPanel('Right suspect, wrong proof',
        'You have the right person, but that card will not convince a jury. Which card shows she lied about never leaving the conservatory, or ties her to the poison? (You may still need to find it.)',
        `Accusations so far: ${G.attempts}   |   Press Accuse to try again`);
    } else {
      setPanel(`${s.name} is innocent`, REBUTTALS[G.accused], `Accusations so far: ${G.attempts}   |   Press Accuse to try again`);
    }
  }

  function showIntro() {
    playScene('manor');
    const controls = inXR()
      ? 'Aim a controller and pull the trigger to select.'
      : 'Desktop: drag to look, W A S D to walk, click to select.';
    setPanel('The Larkspur nightcap',
      'Edmund Larkspur was poisoned on his 70th birthday. The police report (card 1) is on your table. The other six pieces of evidence are hidden around your real room: on walls, doors, windows, furniture and the floor.\n\n' +
      'Sweep your laser around the room. Hidden evidence lights up when the beam touches it. Walk up to it and pull the trigger to bring it back here.\n' +
      'Question suspects on the left. Press Hint if you are stuck, and Accuse when you know who did it.\n\n' + controls,
      foundText());
  }

  function resetGame() {
    G.started = true;
    G.mode = 'investigate'; G.seen.clear(); G.found = new Set(['study']);
    G.accused = null; G.attempts = 0; G.trailDone = false; G.origins = {};
    endAccusationUI();
    accuseBtn.setAttribute('text', 'value', 'Accuse');
    clearRoomFx();
    CARD_ORDER.forEach(updateSlot);
    const spotsFor = computeSpots(HIDDEN_CARDS);
    HIDDEN_CARDS.forEach(id => makeHiddenCard(id, spotsFor[id]));
    showIntro();
  }

  function resetRoot() {
    root.object3D.position.copy(DEFAULT_ROOT.pos);
    root.object3D.rotation.set(0, DEFAULT_ROOT.rotY, 0);
    root.setAttribute('visible', true);
  }

  // ---------- WebXR session: hit-test fallback for unscanned rooms ----------
  function initXR() {
    const s = sceneEl().renderer.xr.getSession();
    if (!s) return;
    XRW.session = s;
    const addSources = () => {
      if (!s.requestHitTestSource) return;
      for (const src of s.inputSources) {
        if (!src.targetRaySpace || XRW.hitSources.has(src)) continue;
        XRW.hitSources.set(src, null);
        s.requestHitTestSource({ space: src.targetRaySpace })
          .then(h => XRW.hitSources.set(src, h))
          .catch(() => XRW.hitSources.delete(src));
      }
    };
    addSources();
    s.addEventListener('inputsourceschange', addSources);
    s.addEventListener('select', () => {
      if (G.phase === 'place' && XRW.aim && XRW.aim.hitTest) {
        if (XRW.aim.flat) placeAt(XRW.aim.point.clone(), null);
        else hudSay('Point at a flat surface, like a table or desk, and pull the trigger.');
      }
    });
    hudScanBtn.setAttribute('visible', !!s.initiateRoomCapture);
  }

  // ---------- Desktop preview room (open the page with ?room=demo) ----------
  function buildFakeRoom() {
    const Q = (x, y, z) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z, 'XYZ'));
    const add = (key, label, orientation, pos, quat, w, d) =>
      upsertPlane(key, { label, orientation, pos, quat, minX: -w / 2, maxX: w / 2, minZ: -d / 2, maxZ: d / 2, t: 0, fake: true });
    const H = Math.PI / 2;
    add('floor', 'floor', 'horizontal', V3(0, 0, -1), Q(0, 0, 0), 4.4, 4.4);
    add('desk', 'table', 'horizontal', V3(0, 0.74, -1.05), Q(0, 0, 0), 1.2, 0.65);
    add('couch', 'couch', 'horizontal', V3(-1.5, 0.45, 0.2), Q(0, 0, 0), 0.7, 1.6);
    add('back', 'wall', 'vertical', V3(0, 1.3, -3.2), Q(H, 0, 0), 4.4, 2.6);
    add('window', 'window', 'vertical', V3(1.0, 1.45, -3.17), Q(H, 0, 0), 1.0, 0.9);
    add('left', 'wall', 'vertical', V3(-2.2, 1.3, -1), Q(0, 0, -H), 2.6, 4.4);
    add('right', 'wall', 'vertical', V3(2.2, 1.3, -1), Q(0, 0, H), 2.6, 4.4);
    add('door', 'door', 'vertical', V3(2.17, 1.0, 0.2), Q(0, 0, H), 2.0, 0.9);
    // stand-in furniture so the preview looks like a room
    const F = builder(make('a-entity', { 'hide-on-enter-ar': '' }, worldEl));
    F.box(0, 0.365, -1.05, 1.2, 0.73, 0.65, '#6b4a33');
    F.box(-1.5, 0.22, 0.2, 0.7, 0.44, 1.6, '#4a5a7a');
    F.box(0, 1.3, -3.22, 4.4, 2.6, 0.02, '#3a3f4a');
    F.box(1.0, 1.45, -3.2, 1.0, 0.9, 0.02, '#7fa8c9');
    F.box(-2.22, 1.3, -1, 0.02, 2.6, 4.4, '#353a44');
    F.box(2.22, 1.3, -1, 0.02, 2.6, 4.4, '#353a44');
    F.box(2.2, 1.0, 0.2, 0.03, 2.0, 0.9, '#6b4a33');
  }

  // ---------- Build everything ----------
  function button(parent, y, label, color, onClick) {
    const b = make('a-plane', {
      position: P(0, y, 0), rotation: '-10 0 0', width: 0.26, height: 0.058,
      material: `shader: flat; color: ${color}`, class: 'clickable', 'hover-fx': 'color: #3a4a66'
    }, parent);
    setText(b, label, { width: 0.5, wrapCount: 20, color: PAL.text });
    b.addEventListener('click', onClick);
    return b;
  }

  function init() {
    root = document.querySelector('#game');
    worldEl = document.querySelector('#world');
    const R = builder(root);

    // A felt mat that lies on your real table, and the diorama stage
    R.box(0, 0.002, 0.08, 1.0, 0.004, 0.84, PAL.felt);
    R.box(0, 0.012, 0, 0.5, 0.02, 0.5, '#1d140e');
    content = R.group(0, 0.022, 0);

    // Narration panel
    const panel = R.group(0, 0.38, -0.36, { rotation: '-12 0 0' });
    make('a-plane', { position: '0 0 -0.002', width: 1.016, height: 0.436, material: `shader: flat; color: ${PAL.brass}` }, panel);
    make('a-plane', { width: 1.0, height: 0.42, material: `shader: flat; color: ${PAL.ink}` }, panel);
    panelTitle = make('a-entity', { position: '0 0.185 0.002' }, panel);
    setText(panelTitle, '', { color: '#f2c94c', width: 0.92, wrapCount: 38, baseline: 'top' });
    panelBody = make('a-entity', { position: '0 0.125 0.002' }, panel);
    setText(panelBody, '', { color: PAL.text, width: 0.92, wrapCount: 52, align: 'left', baseline: 'top' });
    panelFoot = make('a-entity', { position: '0 -0.19 0.002' }, panel);
    setText(panelFoot, '', { color: '#8f9bb8', width: 0.92, wrapCount: 72, baseline: 'bottom' });

    // Evidence card slots
    R.text(0, 0.006, 0.48, 'Evidence cards', { color: '#d9c98f', width: 0.4, wrapCount: 22 }, { rotation: '-90 0 0' });
    CARD_ORDER.forEach((id, i) => {
      const g = R.group((i - 3) * 0.118, 0.078, 0.36, { rotation: P(-22, -(i - 3) * 7, 0) });
      const frame = make('a-box', { width: 0.1, height: 0.135, depth: 0.005, color: PAL.paper, class: 'clickable', 'hover-fx': '' }, g);
      frame._photo = make('a-plane', { position: '0 0.018 0.0031', width: 0.086, height: 0.08, material: `shader: flat; color: ${SCENES[id].card.color}` }, frame);
      frame._num = setText(make('a-entity', { position: '0 0.018 0.0045' }, frame), String(i + 1), { width: 0.35, wrapCount: 8, color: '#fffaf0' });
      frame._cap = setText(make('a-entity', { position: '0 -0.045 0.0035' }, frame), '', { width: 0.095, wrapCount: 14, color: '#2a2018' });
      frame.addEventListener('click', () => onCard(id));
      cardEls[id] = frame;
    });

    // Suspects
    const shelf = R.group(-0.62, 0, -0.02, { rotation: '0 38 0' });
    const SH = builder(shelf);
    SH.box(0, 0.01, 0, 0.42, 0.02, 0.1, '#2b1d14');
    SH.text(0, 0.33, 0, 'Suspects', { color: '#d9c98f', width: 0.4, wrapCount: 16 });
    SUSPECTS.forEach((s, i) => {
      const x = -0.15 + i * 0.1;
      SH.cyl(x, 0.03, 0, 0.034, 0.02, COLORS[s.id]);
      const fig = person(shelf, s.id, x, 0, 0, { label: false });
      fig.setAttribute('position', P(x, 0.04, 0));
      fig.setAttribute('scale', '2.2 2.2 2.2');
      suspectFigs[s.id] = fig;
      const tag = SH.group(x, 0.275, 0, {
        geometry: 'primitive: plane; width: 0.095; height: 0.026',
        material: 'shader: flat; color: #111418; opacity: 0.75; transparent: true'
      });
      setText(tag, NAMES[s.id], { color: COLORS[s.id], width: 0.15, wrapCount: 13 });
      const hit = SH.cyl(x, 0.14, 0, 0.045, 0.24, '#ffffff', { opacity: 0, class: 'clickable' });
      hit.setAttribute('material', 'depthWrite', false);
      hit.addEventListener('click', () => onSuspect(s.id));
      hit.addEventListener('mouseenter', () => { if (!fig.hasAttribute('pulse')) fig.object3D.scale.setScalar(2.45); });
      hit.addEventListener('mouseleave', () => { if (!fig.hasAttribute('pulse')) fig.object3D.scale.setScalar(2.2); });
    });

    // Controls
    const ctrl = R.group(0.62, 0, -0.02, { rotation: '0 -38 0' });
    button(ctrl, 0.40, 'Next step', '#2c3a52', () => { if (G.phase !== 'hunt') return; sfx.click(); if (run.i < run.steps.length) nextStep(); });
    button(ctrl, 0.33, 'Replay card', '#2c3a52', () => { if (G.phase !== 'hunt') return; sfx.click(); if (G.mode === 'investigate' && SCENES[run.id] && SCENES[run.id].card) playScene(run.id); });
    button(ctrl, 0.26, 'Hint', '#2c3a52', onHint);
    accuseBtn = button(ctrl, 0.19, 'Accuse', PAL.oxblood, onAccuse);
    button(ctrl, 0.12, 'Move table', '#2c3a52', () => { if (G.phase !== 'hunt') return; sfx.click(); beginPlacement(); });

    // Placement HUD (floats in front of you while you choose your table)
    hud = make('a-entity', { visible: false }, worldEl);
    make('a-plane', { position: '0 0 -0.002', width: 0.86, height: 0.5, material: `shader: flat; color: ${PAL.brass}` }, hud);
    make('a-plane', { width: 0.85, height: 0.49, material: `shader: flat; color: ${PAL.ink}` }, hud);
    setText(make('a-entity', { position: '0 0.21 0.002' }, hud), 'Set up the crime scene', { color: '#f2c94c', width: 0.8, wrapCount: 30, baseline: 'top' });
    hudBody = setText(make('a-entity', { position: '0 0.14 0.002' }, hud), '', { width: 0.78, wrapCount: 44, align: 'left', baseline: 'top' });
    const hb1 = make('a-plane', { position: '-0.2 -0.19 0.004', width: 0.36, height: 0.065, material: 'shader: flat; color: #2c3a52', class: 'clickable', 'hover-fx': 'color: #3a4a66' }, hud);
    setText(hb1, 'Set up in front of me', { width: 0.6, wrapCount: 24 });
    hb1.addEventListener('click', placeInFront);
    hudScanBtn = make('a-plane', { position: '0.2 -0.19 0.004', width: 0.36, height: 0.065, material: 'shader: flat; color: #2c3a52', class: 'clickable', 'hover-fx': 'color: #3a4a66', visible: false }, hud);
    setText(hudScanBtn, 'Scan my room', { width: 0.6, wrapCount: 24 });
    hudScanBtn.addEventListener('click', () => {
      if (G.phase === 'place' && XRW.session && XRW.session.initiateRoomCapture) XRW.session.initiateRoomCapture().catch(() => {});
    });

    // Placement reticle
    reticle = make('a-entity', {}, worldEl);
    reticle._ring = make('a-ring', { 'radius-inner': 0.05, 'radius-outer': 0.07, rotation: '-90 0 0', material: 'shader: flat; color: #f2c94c; side: double' }, reticle);
    make('a-circle', { radius: 0.012, rotation: '-90 0 0', material: 'shader: flat; color: #ffffff' }, reticle);
    reticle.object3D.visible = false;

    // Entering passthrough AR -> choose your real table, then a fresh search
    const scene = sceneEl();
    scene.addEventListener('enter-vr', () => {
      if (!scene.is('ar-mode')) return;
      XRW.recs.forEach((r, k) => { if (r.fake) { removeEl(r.el); XRW.recs.delete(k); } });
      G.started = false;
      clearRoomFx();
      setTimeout(() => { initXR(); beginPlacement(); }, 700);
    });
    scene.addEventListener('exit-vr', () => {
      XRW.hitSources.clear();
      XRW.recs.forEach((r, k) => { if (!r.fake) { removeEl(r.el); XRW.recs.delete(k); } });
      clearInterval(XRW.statusTimer);
      hud.setAttribute('visible', false); reticle.object3D.visible = false;
      setRayTargets('.clickable');
      G.phase = 'hunt'; G.tableRec = null;
      resetRoot(); resetGame();
    });

    window.addEventListener('keydown', e => { if (e.key === 'n' || e.key === 'N') nextStep(); });

    if (/room=demo/.test(location.search)) { buildFakeRoom(); beginPlacement(); }
    else { resetRoot(); resetGame(); }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const scene = document.querySelector('a-scene');
    if (scene.hasLoaded) init(); else scene.addEventListener('loaded', init);
  });
  </script>
</head>

<body>
  <!-- AR only: the game lives in your real room (passthrough) -->
  <a-scene
    xr-mode-ui="XRMode: ar"
    webxr="requiredFeatures: local-floor; optionalFeatures: hit-test, plane-detection, anchors"
    real-world
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable; far: 8"
    renderer="antialias: true"
    loading-screen="dotsColor: #c9a227; backgroundColor: #16202b">

    <a-entity light="type: ambient; intensity: 0.75"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="0.6 2 1"></a-entity>

    <!-- Desktop-preview room only; hidden in passthrough so you see your real room -->
    <a-sky color="#141a22" hide-on-enter-ar></a-sky>
    <a-entity hide-on-enter-ar>
      <a-plane rotation="-90 0 0" width="14" height="14" color="#2a211c"></a-plane>
    </a-entity>

    <a-entity id="rig">
      <a-entity id="cam" camera look-controls wasd-controls="acceleration: 12" position="0 1.6 0"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 8; lineColor: #c9a227; lineOpacity: 0.8"></a-entity>
      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 8; lineColor: #8ab4ff; lineOpacity: 0.8"></a-entity>
    </a-entity>

    <!-- Real-room things (surfaces, hidden evidence, footprints, ghost) live in world space -->
    <a-entity id="world"></a-entity>

    <!-- The tabletop game, placed on your real table -->
    <a-entity id="game"></a-entity>
  </a-scene>
</body>
</html>
